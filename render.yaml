services:
  - type: web
    name: kaybee-tracker
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: SHEET_ID
        sync: false
      - key: MANAGER_PASSCODE
        sync: false
      - key: REP_PASSCODE
        sync: false
